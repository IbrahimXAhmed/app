<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="لوحة اختبارات حديثة لعرض الاختبارات القادمة والنتائج بتصميم متقدم وواجهة عربية RTL." />
  <title>MySchool — Advanced Quiz Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-solid: #111934;
      --text: #e7edff;
      --muted: #a9b5df;
      --primary: #5f86ff;
      --primary-2: #62d7ff;
      --success: #2fdd92;
      --danger: #ff6e7f;
      --warning: #ffcb57;
      --ring: rgba(98, 215, 255, 0.35);
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 16px 48px rgba(10, 16, 33, 0.45);
    }

    [data-theme="light"] {
      --bg: #f4f7ff;
      --panel: rgba(255, 255, 255, 0.8);
      --panel-solid: #ffffff;
      --text: #1b2646;
      --muted: #566087;
      --primary: #3d66ff;
      --primary-2: #00a8d8;
      --ring: rgba(47, 111, 255, 0.2);
      --border: rgba(17, 35, 80, 0.14);
      --shadow: 0 14px 40px rgba(34, 59, 118, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Cairo", system-ui, sans-serif;
      background:
        radial-gradient(1200px 800px at 100% -10%, rgba(95, 134, 255, 0.3), transparent 55%),
        radial-gradient(1000px 640px at 10% -20%, rgba(98, 215, 255, 0.25), transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .app {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 1rem;
    }

    .glass {
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: center;
      padding: 1.1rem 1.2rem;
      margin-bottom: 1rem;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.9rem);
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .title p {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button,
    select,
    input {
      font: inherit;
      border: 0;
      color: inherit;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      border-radius: 12px;
      padding: 0.62rem 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.7fr 1fr 1fr;
      gap: .8rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .field {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 0.68rem 0.85rem;
      background: transparent;
      outline: 0;
    }

    .field:focus-within {
      box-shadow: 0 0 0 4px var(--ring);
      border-color: transparent;
    }

    .grid {
      display: grid;
      gap: 0.8rem;
    }

    .card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      padding: 1rem;
      align-items: center;
      transition: transform .2s ease, border-color .2s ease;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel-solid);
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--primary-2);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .subject {
      margin: 0 0 .35rem;
      font-size: 1.1rem;
      font-weight: 800;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .3rem .55rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .upcoming { background: rgba(47, 221, 146, .12); color: var(--success); border-color: rgba(47,221,146,.3); }
    .done { background: rgba(255, 203, 87, .12); color: var(--warning); border-color: rgba(255,203,87,.3); }

    .score {
      min-width: 64px;
      text-align: center;
      padding: .55rem .65rem;
      border-radius: 10px;
      font-weight: 800;
      background: rgba(95, 134, 255, .14);
      border: 1px solid rgba(95, 134, 255, .4);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
      border-radius: 14px;
      background: var(--panel-solid);
      border: 1px dashed var(--border);
    }

    @media (max-width: 900px) {
      .toolbar { grid-template-columns: 1fr; }
      .header { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; }
      .card { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="header glass">
      <div class="title">
        <h1>لوحة الاختبارات الذكية</h1>
        <p>تصميم احترافي ببحث لحظي، فرز ديناميكي، ووضع ليلي/نهاري.</p>
      </div>
      <div class="actions">
        <button class="btn ghost" id="themeToggle" aria-label="تبديل الثيم">🌓 تبديل الثيم</button>
        <button class="btn" id="resetFilters">إعادة الضبط</button>
      </div>
    </section>

    <section class="toolbar glass" aria-label="filters">
      <label class="field">
        <input id="searchInput" type="search" placeholder="ابحث بالمادة أو اسم المعلم..." />
      </label>
      <label class="field">
        <select id="statusFilter">
          <option value="all">كل الحالات</option>
          <option value="upcoming">اختبارات قادمة</option>
          <option value="done">اختبارات منتهية</option>
        </select>
      </label>
      <label class="field">
        <select id="sortBy">
          <option value="date-desc">الأحدث أولًا</option>
          <option value="date-asc">الأقدم أولًا</option>
          <option value="subject-asc">المادة (أ-ي)</option>
        </select>
      </label>
    </section>

    <section id="quizGrid" class="grid" aria-live="polite"></section>
  </main>

  <script>
    const quizzes = [
      { id: 3275, subject: 'رياضيات', teacher: 'همسه أحمد رجب', date: '2026-04-11', duration: 30, status: 'upcoming', score: null },
      { id: 3273, subject: 'اللغة الإنجليزية', teacher: 'رضا حمدي', date: '2026-04-09', duration: 30, status: 'upcoming', score: null },
      { id: 3271, subject: 'رياضيات', teacher: 'همسه أحمد رجب', date: '2026-03-13', duration: 30, status: 'done', score: 86 },
      { id: 3266, subject: 'اللغة الإنجليزية', teacher: 'رضا حمدي', date: '2026-03-12', duration: 30, status: 'done', score: 91 },
      { id: 3251, subject: 'رياضيات', teacher: 'همسه أحمد رجب', date: '2026-02-13', duration: 30, status: 'done', score: 78 }
    ];

    const els = {
      grid: document.getElementById('quizGrid'),
      searchInput: document.getElementById('searchInput'),
      statusFilter: document.getElementById('statusFilter'),
      sortBy: document.getElementById('sortBy'),
      resetFilters: document.getElementById('resetFilters'),
      themeToggle: document.getElementById('themeToggle')
    };

    const dateFormatter = new Intl.DateTimeFormat('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });

    function getViewModel() {
      const q = els.searchInput.value.trim().toLowerCase();
      const status = els.statusFilter.value;
      const sort = els.sortBy.value;

      let model = quizzes.filter(item => {
        const text = `${item.subject} ${item.teacher}`.toLowerCase();
        const statusMatch = status === 'all' || item.status === status;
        const queryMatch = !q || text.includes(q);
        return statusMatch && queryMatch;
      });

      model.sort((a, b) => {
        if (sort === 'date-asc') return new Date(a.date) - new Date(b.date);
        if (sort === 'subject-asc') return a.subject.localeCompare(b.subject, 'ar');
        return new Date(b.date) - new Date(a.date);
      });

      return model;
    }

    function statusLabel(status) {
      return status === 'upcoming'
        ? '<span class="pill upcoming">● قادم</span>'
        : '<span class="pill done">● منتهي</span>';
    }

    function cardTemplate(item) {
      const action = item.status === 'upcoming'
        ? '<button class="btn" type="button">ابدأ الاختبار</button>'
        : '<button class="btn ghost" type="button">عرض النتيجة</button>';

      const score = item.score === null ? '' : `<div class="score">${item.score}%</div>`;

      return `
        <article class="card">
          <div>
            <h3 class="subject">${item.subject}</h3>
            <div class="meta">
              ${statusLabel(item.status)}
              <span>📅 ${dateFormatter.format(new Date(item.date))}</span>
              <span>⏱ ${item.duration} دقيقة</span>
              <span>👨‍🏫 ${item.teacher}</span>
            </div>
          </div>
          <div style="display:flex; gap:.5rem; align-items:center;">${score}${action}</div>
        </article>
      `;
    }

    function render() {
      const list = getViewModel();
      if (!list.length) {
        els.grid.innerHTML = '<div class="empty">لا توجد نتائج مطابقة للفلاتر الحالية.</div>';
        return;
      }
      els.grid.innerHTML = list.map(cardTemplate).join('');
    }

    function setTheme(nextTheme) {
      document.documentElement.setAttribute('data-theme', nextTheme);
      localStorage.setItem('dashboard-theme', nextTheme);
    }

    function initTheme() {
      const stored = localStorage.getItem('dashboard-theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      setTheme(stored || (prefersLight ? 'light' : 'dark'));
    }

    [els.searchInput, els.statusFilter, els.sortBy].forEach(el => el.addEventListener('input', render));
    els.resetFilters.addEventListener('click', () => {
      els.searchInput.value = '';
      els.statusFilter.value = 'all';
      els.sortBy.value = 'date-desc';
      render();
    });

    els.themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    initTheme();
    render();
  </script>
</body>

</html>
